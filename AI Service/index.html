<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSNA Aneurysm Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 30px;
            background: #ebf5fb;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover { background: #d6eaf8; }
        input[type="file"] { display: none; }
        
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }

        /* Loading Spinner */
        #loading {
            display: none;
            margin-top: 20px;
            font-weight: bold;
            color: #e67e22;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Results Area */
        #result-box {
            display: none;
            margin-top: 25px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #2ecc71;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .result-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .danger { color: #e74c3c; font-weight: bold; }
        .safe { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Aneurysm AI Detector</h2>
    <p>Upload a Patient's ZIP File containing DICOM Images</p>

    <label class="upload-area" for="file-upload" id="upload-label">
        📁 Click here to select a .zip file
    </label>
    <input type="file" id="file-upload" accept=".zip">

    <button id="submit-btn" onclick="uploadZip()">Analyze Scan</button>

    <div id="loading">
        <div class="spinner"></div>
        Processing slices with AI... This may take a moment.
    </div>

    <div id="result-box">
        <h3 style="margin-top:0; color:#2c3e50;">Analysis Results</h3>
        <div id="overall-result" style="font-size: 18px; margin-bottom: 15px;"></div>
        <div id="detailed-results"></div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-upload');
    const uploadLabel = document.getElementById('upload-label');
    const submitBtn = document.getElementById('submit-btn');
    const loadingDiv = document.getElementById('loading');
    const resultBox = document.getElementById('result-box');
    
    // Change label text when file is selected
    fileInput.addEventListener('change', function() {
        if(this.files.length > 0) {
            uploadLabel.innerHTML = "✅ Selected: <b>" + this.files[0].name + "</b>";
            uploadLabel.style.borderColor = "#2ecc71";
            uploadLabel.style.background = "#e9f7ef";
        }
    });

    async function uploadZip() {
        const file = fileInput.files[0];
        if (!file) {
            alert("Please select a ZIP file first!");
            return;
        }

        // Setup UI for loading
        submitBtn.disabled = true;
        loadingDiv.style.display = "block";
        resultBox.style.display = "none";

        const formData = new FormData();
        formData.append("file", file);

        try {
            // Call your local FastAPI server
            const response = await fetch("http://localhost:8000/predict", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Server Error");
            }

            // --- Display Results ---
            
            // 1. Overall Prediction
            const overallProb = (data.overall_prediction["Aneurysm Present"] * 100).toFixed(2);
            const overallDiv = document.getElementById("overall-result");
            
            // تم تعديل الـ Threshold إلى 20% بناءً على طبيعة الداتا الطبية
            if(overallProb >= 20) {
                overallDiv.innerHTML = `Overall Risk: <span class="danger">${overallProb}% (Aneurysm Detected)</span>`;
                resultBox.style.borderLeftColor = "#e74c3c"; // Red border for danger
            } else {
                overallDiv.innerHTML = `Overall Risk: <span class="safe">${overallProb}% (No Aneurysm)</span>`;
                resultBox.style.borderLeftColor = "#2ecc71"; // Green border for safe
            }

            // 2. Detailed Locations
            const detailedDiv = document.getElementById("detailed-results");
            detailedDiv.innerHTML = "<strong>Detailed Locations:</strong><br><br>";
            
            for (const [location, prob] of Object.entries(data.detailed_locations)) {
                const percentage = (prob * 100).toFixed(1);
                // تلوين الشرايين الفرعية بالأحمر لو نسبة الخطر فيها تخطت 10%
                const colorClass = prob > 0.10 ? "danger" : "";
                
                detailedDiv.innerHTML += `
                    <div class="result-item">
                        <span>${location.replace('any', 'Location ')}</span>
                        <span class="${colorClass}">${percentage}%</span>
                    </div>
                `;
            }

            resultBox.style.display = "block";

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            // Reset UI
            submitBtn.disabled = false;
            loadingDiv.style.display = "none";
        }
    }
</script>

</body>
</html>
