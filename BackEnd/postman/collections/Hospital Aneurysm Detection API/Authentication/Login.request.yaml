$kind: http-request
name: Login
method: POST
url: "{{baseUrl}}/auth/login"
scripts:
  - type: afterResponse
    code: "if (pm.response.code === 200) {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.collectionVariables.set(\r

      \        \"access_token\",\r

      \        response.access_token\r

      \    );\r

      }"
    language: text/javascript
examples: .resources/Login.resources/examples
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "loginIdentifier": "000002",
      "password": "password123"
    }
description: Authenticate a user. Returns employee_id, email, and role on success. Returns 401 on invalid credentials.
