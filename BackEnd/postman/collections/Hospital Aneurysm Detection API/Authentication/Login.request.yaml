$kind: http-request
method: POST
url: "{{baseUrl}}/auth/login"
examples: .resources/Login.resources/examples
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "loginIdentifier": "user@example.com",
      "password": "password123",
      "isAdmin": false
    }
description: Authenticate a user. Returns employee_id, email, and role on success. Returns 401 on invalid credentials.
